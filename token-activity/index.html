<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>token activity · ben tossell</title>
  <meta name="description" content="Every token Ben's agents used, by day, across Claude Code, Codex, pi, Factory and bb.">
  <meta name="theme-color" content="#fbfdfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151719" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://bentossell.com/token-activity/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    @font-face { font-family: "Shantell Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url("../assets/shantell-sans-700.ttf") format("truetype"); }
    :root {
      color-scheme: light dark;
      --paper: #fbfdfd; --ink: #202126; --muted: #6b7280; --link: #3389e8;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --hand: "Shantell Sans", "Comic Sans MS", cursive;
    }
    @media (prefers-color-scheme: dark) { :root { --paper: #151719; --ink: #f1f3f5; --muted: #8f99a7; --link: #62a8f5; } }
    html, body { overflow-x: hidden; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 12px/1.5 var(--mono); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-synthesis: none; }
    .page { box-sizing: border-box; max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font: 700 26px/1.2 var(--hand); margin: 0 0 6px; text-wrap: balance; }
    h1 a { color: inherit; text-decoration: none; }
    .lede { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }
    .lede a { color: var(--link); }
    [data-token-activity] { min-height: 320px; }
    [data-token-activity] .ta-title { display: none; }
    .yours { margin-top: 36px; }
    .yours button { all: unset; cursor: pointer; color: var(--muted); padding: 11px 2px; border-radius: 3px; transition: color .15s ease-out, transform .15s ease-out; }
    .yours button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .yours button:active { transform: scale(.96); }
    .yours button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (pointer: coarse) { .yours button { padding: 12px 8px; } }
    @media (prefers-reduced-motion: reduce) { .yours button { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <h1><a href="/">ben tossell</a> / token activity</h1>
    <p class="lede">Visualising my token usage across agent harness and models.</p>
    <div data-token-activity></div>
    <div class="yours"><button type="button" data-copy-prompt>copy instructions for your agent</button></div>
  </main>
  <template id="agent-prompt">i want a 'github activity graph' of every token my coding agents have used, from the session logs already on this machine.

first find every agent app i use and where it keeps its sessions. check at least: claude code (~/.claude/projects/**/*.jsonl), codex (~/.codex/sessions/), pi (~/.pi/agent/sessions/), factory/droid (~/.factory/sessions/, the *.settings.json files hold the token totals). look for any others too. tell me what you found before you build.

then scan them all and count input, output, cache read and cache write tokens per day, per app, and per model. if you want cost, use list prices from models.dev/api.json.

build one self-contained html file with the data inlined. a year heatmap, one square per day, coloured by whichever app did the most that day. click an app name to isolate it. a switch for tokens / output only / cost. under it a weekly bar chart stacked by model. hover a square or bar for the split. plain mono type, light and dark.

open it for me when it's done. then ask me two things, don't do them: do i want different colours or a theme, and do i want an hourly or daily job (launchd or cron) that rescans and rebuilds the file so it stays current.</template>
  <script src="graph.js?v=10"></script>
  <script>
    (() => {
      const btn = document.querySelector('[data-copy-prompt]');
      const text = document.getElementById('agent-prompt').content.textContent.trim();
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(text); } catch { return; }
        btn.textContent = 'copied';
        setTimeout(() => { btn.textContent = 'copy instructions for your agent'; }, 1500);
      });
    })();
  </script>
</body>
</html>
