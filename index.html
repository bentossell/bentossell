<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ben Tossell — builder + investor.">
  <link rel="canonical" href="https://bentossell.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ben Tossell">
  <meta property="og:title" content="Ben Tossell">
  <meta property="og:description" content="Ben Tossell — builder + investor.">
  <meta property="og:url" content="https://bentossell.com/">
  <meta property="og:image" content="https://bentossell.com/assets/social-home.png">
  <meta property="og:image:secure_url" content="https://bentossell.com/assets/social-home.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ben Tossell — builder and investor">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ben Tossell">
  <meta name="twitter:description" content="Ben Tossell — builder + investor.">
  <meta name="twitter:image" content="https://bentossell.com/assets/social-home.png">
  <meta name="twitter:image:alt" content="Ben Tossell — builder and investor">
  <meta name="theme-color" content="#fbfdfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151719" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" sizes="any">
  <title>Ben Tossell</title>
  <style>
    @font-face {
      font-family: "Shantell Sans";
      src: url("assets/shantell-sans-700.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --paper: #fbfdfd;
      --ink: #202126;
      --muted: #9ba4b1;
      --line: #aab3be;
      --link: #3389e8;
      --rule: #e5e9eb;
      --tooltip: rgb(32 33 38 / 58%);
      --divider-bump: #cfd6db;
      --post-bg: #fff;
      --post-shadow: 0 1px 0 rgb(30 35 40 / 4%);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --hand: "Shantell Sans", "Comic Sans MS", cursive;
      --content-width: 720px;
      --annotation-gutter: clamp(0px, calc(100vw - 480px), 150px);
      --mascot-width: 104px;
      --mascot-height: 68px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151719;
        --ink: #f1f3f5;
        --muted: #8f99a7;
        --line: #68727d;
        --link: #62a8f5;
        --rule: #30353a;
        --tooltip: rgb(241 243 245 / 62%);
        --divider-bump: #59616a;
        --post-bg: #202327;
        --post-shadow: 0 1px 0 rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 17px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--link);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .page {
      width: min(1020px, calc(100% - 30px));
      margin: 0 auto;
      padding: 118px 0 150px;
    }

    .runner-track {
      position: relative;
      height: 2px;
      margin: 0 0 72px;
    }

    .rule {
      height: 2px;
      margin: 0;
      border: 0;
      background: var(--rule);
    }

    .mascot-lane {
      position: absolute;
      right: 0;
      bottom: 2px;
      left: 0;
      height: var(--mascot-height);
      pointer-events: none;
    }

    .mascot-runner {
      --mascot-x: 0px;
      --mascot-jump: 0px;
      position: absolute;
      bottom: 0;
      left: 0;
      width: var(--mascot-width);
      height: var(--mascot-height);
      margin: 0;
      padding: 0;
      border: 0;
      appearance: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: 50% 100%;
      transform: translate3d(var(--mascot-x), var(--mascot-jump), 0);
      will-change: transform;
    }

    .mascot-runner:focus-visible { outline: none; }

    .mascot-runner:focus-visible .mascot-sprite {
      filter: drop-shadow(0 0 3px rgb(51 137 232 / 35%));
    }

    .mascot-tooltip {
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      z-index: 2;
      padding: 2px 0;
      color: var(--tooltip);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .mascot-runner:hover .mascot-tooltip,
    .mascot-runner:focus-visible .mascot-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .divider-bump {
      --bump-x: 0px;
      position: absolute;
      top: 0;
      left: var(--bump-x);
      width: 28px;
      height: 2px;
      background: var(--divider-bump);
      opacity: 0;
      pointer-events: none;
      transform: scaleX(.25);
    }

    .divider-bump.is-active {
      animation: divider-step 180ms ease-out;
    }

    .mascot-sprite {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mascot-character {
      transform-origin: 50% 78%;
      animation: mascot-gait-body 520ms linear infinite;
    }

    .mascot-arm-left,
    .mascot-leg-right {
      animation: mascot-gait-a 520ms linear infinite;
    }

    .mascot-arm-right,
    .mascot-leg-left {
      animation: mascot-gait-b 520ms linear infinite;
    }

    .mascot-eye {
      transform-box: fill-box;
      transform-origin: 50% 65%;
      transition: transform 70ms ease;
    }

    .mascot-pupil {
      transform: translate(var(--pupil-x, 0px), var(--pupil-y, 0px));
      transition: transform 90ms ease-out;
    }

    .mascot-runner.is-blinking .mascot-eye { transform: scaleY(.08); }

    .mascot-tongue {
      transform-box: fill-box;
      transform-origin: 50% 0;
      animation: mascot-tongue 1.4s ease-in-out infinite;
    }

    .mascot-runner.is-boosting .mascot-character,
    .mascot-runner.is-boosting .mascot-arm-left,
    .mascot-runner.is-boosting .mascot-arm-right,
    .mascot-runner.is-boosting .mascot-leg-left,
    .mascot-runner.is-boosting .mascot-leg-right {
      animation-duration: 290ms;
    }

    .mascot-runner.is-turning .mascot-character {
      animation: mascot-turn 300ms ease-out;
    }

    .mascot-runner.is-airborne .mascot-character {
      animation: mascot-airborne 420ms ease-in-out infinite alternate;
    }

    .mascot-runner.is-landing .mascot-character {
      animation: mascot-land 170ms ease-out;
    }

    .mascot-runner.is-waving .mascot-arm-right {
      animation: mascot-wave 210ms ease-in-out 5 alternate;
    }

    @keyframes mascot-gait-body {
      0%, 50%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-2px) rotate(-1.2deg); }
      75% { transform: translateY(-2px) rotate(1.2deg); }
    }

    @keyframes mascot-gait-a {
      0%, 100% { transform: rotate(-12deg); }
      25% { transform: rotate(7deg); }
      50% { transform: rotate(13deg); }
      75% { transform: rotate(-5deg); }
    }

    @keyframes mascot-gait-b {
      0%, 100% { transform: rotate(12deg); }
      25% { transform: rotate(-7deg); }
      50% { transform: rotate(-13deg); }
      75% { transform: rotate(5deg); }
    }

    @keyframes mascot-turn {
      0% { transform: translateX(0) scale(1); }
      35% { transform: translateX(4px) scaleX(1.08) scaleY(.9); }
      65% { transform: translateX(-2px) scaleX(.96) scaleY(1.05); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes mascot-airborne {
      from { transform: rotate(-2deg) scaleX(.96) scaleY(1.04); }
      to { transform: rotate(2deg) scaleX(1.02) scaleY(.98); }
    }

    @keyframes mascot-land {
      0% { transform: scaleX(.94) scaleY(1.08); }
      45% { transform: scaleX(1.1) scaleY(.86); }
      100% { transform: scale(1); }
    }

    @keyframes mascot-wave {
      from { transform: rotate(8deg); }
      to { transform: rotate(-38deg); }
    }

    @keyframes mascot-tongue {
      0%, 72%, 100% { transform: translateY(0) rotate(0); }
      82% { transform: translateY(1px) rotate(-4deg); }
      92% { transform: translateY(0) rotate(3deg); }
    }

    @keyframes divider-step {
      0% { opacity: 0; transform: scaleX(.25); }
      45% { opacity: .9; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(1.35); }
    }

    .intro { margin-bottom: 50px; }

    h1,
    .section-title {
      margin: 0;
      font-family: var(--hand);
      font-weight: 700;
      letter-spacing: .01em;
    }

    h1 {
      font-size: clamp(27px, 4vw, 34px);
      line-height: 1.25;
    }

    h1 a {
      color: inherit;
      text-decoration: none;
    }

    .intro p {
      max-width: 920px;
      margin: 8px 0 0;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.48;
    }

    details > summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    details > summary::-webkit-details-marker { display: none; }
    .section { margin-top: 52px; }

    .section-title {
      position: relative;
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 11px;
      font-size: 26px;
      line-height: 1.3;
    }

    .runner-track,
    .intro,
    .section {
      width: min(var(--content-width), calc(100% - var(--annotation-gutter)));
      margin-left: var(--annotation-gutter);
    }

    .markdown-token { display: inline-block; }

    .markdown-note {
      position: absolute;
      top: 1px;
      right: calc(100% + 28px);
      width: 108px;
      color: #ff6b6b;
      font-family: var(--hand);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: .01em;
      text-align: left;
      transform: rotate(-2deg);
    }

    .section-title.annotation-on-right .markdown-note {
      right: auto;
      left: calc(100% + 24px);
    }

    .expand-annotation {
      position: relative;
      width: fit-content;
      max-width: 100%;
    }

    .expand-annotation > .tree {
      width: max-content;
      max-width: 100%;
    }

    .expand-note {
      position: absolute;
      top: 50%;
      right: calc(100% + 42px);
      color: #d66bea;
      font-family: var(--hand);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transform: translateY(-50%) rotate(-2deg);
    }

    .expand-annotation.bracket-bottom { margin-bottom: 60px; }

    .expand-annotation.bracket-bottom .expand-note {
      top: calc(100% + 28px);
      right: auto;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
    }

    .branch-title::after {
      content: "+";
      color: var(--muted);
      font-family: var(--mono);
      font-size: .65em;
      font-weight: 700;
    }

    details[open] > .branch-title::after { content: "−"; }

    .tree {
      position: relative;
      margin: 18px 0 0 12px;
      padding: 0 0 0 27px;
      list-style: none;
    }

    .tree > li {
      position: relative;
      min-height: 34px;
      margin: 0;
      padding: 4px 0;
    }

    .tree > li::before {
      content: "";
      position: absolute;
      top: 16px;
      left: -27px;
      width: 22px;
      border-top: 2px solid var(--line);
    }

    .tree > li::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -27px;
      border-left: 2px solid var(--line);
    }

    .tree > li:last-child::after {
      bottom: auto;
      height: 16px;
    }

    .tree .tree {
      margin-top: 3px;
      margin-left: 8px;
    }

    .branch-title {
      display: flex;
      width: fit-content;
      max-width: 100%;
      align-items: baseline;
      gap: 8px;
      font-weight: 700;
    }

    .branch-title a { white-space: nowrap; }
    .muted { color: var(--muted); }

    .portfolio strong,
    .previously strong { color: var(--muted); }

    .post-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
      gap: 18px;
      width: min(560px, 100%);
      padding: 3px 0 10px;
      align-items: start;
    }

    .post-link {
      display: block;
      overflow: hidden;
      background: var(--post-bg);
      box-shadow: var(--post-shadow);
    }

    .post-link img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 120ms ease;
    }

    .post-link:hover img { opacity: .82; }

    .loading,
    .load-error {
      color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 680px) {
      body { font-size: 14px; }

      .page {
        width: min(100% - 30px, 1020px);
        padding: 96px 0 88px;
      }

      :root {
        --mascot-width: 80px;
        --mascot-height: 52px;
      }

      .runner-track { margin-bottom: 45px; }
      .intro { margin-bottom: 38px; }
      .section { margin-top: 38px; }
      .section-title { font-size: 23px; }
      .markdown-note {
        top: 0;
        width: 92px;
        font-size: 15px;
      }
      .section-title.annotation-on-right .markdown-note { left: calc(100% + 16px); }
      .expand-note { font-size: 15px; }
      .expand-annotation.bracket-bottom { margin-bottom: 68px; }
      .expand-annotation > .tree { max-width: 100%; }
      .tree { margin-left: 8px; padding-left: 23px; }
      .tree > li::before { left: -23px; width: 18px; }
      .tree > li::after { left: -23px; }
      .tree .tree { margin-left: 4px; }
      .post-row { gap: 9px; }
      .branch-title { gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .post-link img { transition: none; }
      .mascot-runner {
        transform: none;
      }
      .mascot-character,
      .mascot-arm-left,
      .mascot-arm-right,
      .mascot-leg-left,
      .mascot-leg-right,
      .mascot-tongue,
      .divider-bump { animation: none; }
      .mascot-eye,
      .mascot-pupil,
      .mascot-tooltip { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page" id="content">
    <p class="loading">loading content.md…</p>

  </main>

  <script src="token-activity/graph.js" defer></script>
  <script type="module">
    import { annotate } from "https://unpkg.com/rough-notation@0.5.1/lib/rough-notation.esm.js";

    const contentRoot = document.querySelector("#content");

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function safeUrl(value) {
      const url = value.trim();
      return /^(https?:|mailto:|assets\/)/.test(url) ? url : "#";
    }

    function renderInline(value) {
      const tokens = [];
      const store = (html) => {
        const token = `\u0000${tokens.length}\u0000`;
        tokens.push(html);
        return token;
      };

      let source = value;

      source = source.replace(/\[!\[([^\]]*)\]\(([^)]+)\)\]\(([^)]+)\)/g, (_, alt, imageUrl, linkUrl) => store(
        `<a class="post-link" href="${escapeHtml(safeUrl(linkUrl))}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(alt)}"><img src="${escapeHtml(safeUrl(imageUrl))}" alt="${escapeHtml(alt)}"></a>`
      ));

      source = source.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        const url = safeUrl(href);
        return store(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
      });

      source = source.replace(/\*\*([^*]+)\*\*/g, (_, text) => store(`<strong>${escapeHtml(text)}</strong>`));
      source = source.replace(/\\([\[\]()])/g, "$1");
      source = escapeHtml(source);

      return source.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[Number(index)]);
    }

    function parseMarkdown(markdown) {
      const model = { title: "", intro: [], sections: [], markdownAnnotation: "", expandAnnotation: "" };
      const lines = markdown.replace(/\r/g, "").split("\n");
      let currentSection = null;
      let paragraph = [];
      let itemStack = [];

      const flushParagraph = () => {
        if (!paragraph.length) return;
        model.intro.push(paragraph.join(" ").trim());
        paragraph = [];
      };

      for (const line of lines) {
        const markdownAnnotationMatch = line.match(/^<!--\s*markdown-annotation:\s*(.+?)\s*-->$/i);
        if (markdownAnnotationMatch) {
          flushParagraph();
          model.markdownAnnotation = markdownAnnotationMatch[1].trim();
          continue;
        }

        const expandAnnotationMatch = line.match(/^<!--\s*expand-annotation:\s*(.+?)\s*-->$/i);
        if (expandAnnotationMatch) {
          flushParagraph();
          model.expandAnnotation = expandAnnotationMatch[1].trim();
          continue;
        }

        const embedMatch = line.match(/^<!--\s*embed:\s*(.+?)\s*-->$/i);
        if (embedMatch) {
          flushParagraph();
          model.sections.push({ embed: embedMatch[1].trim() });
          continue;
        }

        if (line.startsWith("# ")) {
          flushParagraph();
          model.title = line.slice(2).trim();
          continue;
        }

        if (line.startsWith("## ")) {
          flushParagraph();
          currentSection = { title: line.slice(3).trim(), items: [] };
          model.sections.push(currentSection);
          itemStack = [];
          continue;
        }

        const listMatch = line.match(/^(\s*)-\s+(.+)$/);
        if (listMatch && currentSection) {
          const depth = Math.floor(listMatch[1].replace(/\t/g, "  ").length / 2);
          const item = { text: listMatch[2].trim(), children: [] };
          const parent = depth === 0 ? currentSection.items : itemStack[depth - 1]?.children;
          (parent || currentSection.items).push(item);
          itemStack[depth] = item;
          itemStack.length = depth + 1;
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          continue;
        }

        if (!currentSection) paragraph.push(line.trim());
      }

      flushParagraph();
      return model;
    }

    function renderItems(items, depth = 0) {
      return items.map((item) => {
        if (item.children.length) {
          const open = depth > 0 ? " open" : "";
          const muted = depth > 0 ? " muted" : "";
          const listClass = item.text.toLowerCase() === "portfolio" ? "tree portfolio" : "tree";
          return `<li><details class="branch"${open}><summary class="branch-title${muted}"><span>${renderInline(item.text)}</span></summary><ul class="${listClass}">${renderItems(item.children, depth + 1)}</ul></details></li>`;
        }

        if (item.text.includes("![")) {
          return `<li><div class="post-row">${renderInline(item.text)}</div></li>`;
        }

        return `<li class="muted"><span class="tree-leaf">${renderInline(item.text)}</span></li>`;
      }).join("");
    }

    let stopMascot = () => {};
    let stopRoughAnnotations = () => {};

    async function setupRoughAnnotations() {
      stopRoughAnnotations();

      const markdownToken = contentRoot.querySelector("[data-markdown-annotation]");
      const markdownTitle = markdownToken?.closest(".section-title");
      const markdownNote = markdownTitle?.querySelector(".markdown-note");
      const expandTarget = contentRoot.querySelector("[data-expand-annotation]");
      const expandWrapper = expandTarget?.closest(".expand-annotation");
      const expandNote = expandWrapper?.querySelector(".expand-note");
      if (!markdownToken || !markdownTitle || !markdownNote || !expandTarget || !expandWrapper || !expandNote) return;

      await document.fonts.ready;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const roughBox = annotate(markdownToken, {
        type: "box",
        color: "#ff6b6b",
        strokeWidth: 2.25,
        padding: [1, 5],
        iterations: 1,
        animate: !reducedMotion,
        animationDuration: 680
      });
      let roughBracket = null;
      let bracketPosition = "";
      let resizeTimer = 0;

      function placeMarkdownNote() {
        const availableLeft = markdownTitle.getBoundingClientRect().left;
        markdownTitle.classList.toggle("annotation-on-right", availableLeft < markdownNote.offsetWidth + 42);
      }

      function getBracketPosition() {
        return expandTarget.getBoundingClientRect().left >= expandNote.offsetWidth + 72 ? "left" : "bottom";
      }

      function sizeExpandTargetToContent() {
        expandTarget.style.removeProperty("width");
        const targetLeft = expandTarget.getBoundingClientRect().left;
        const sectionRight = expandWrapper.closest(".section").getBoundingClientRect().right;
        const availableWidth = Math.max(0, sectionRight - targetLeft);
        const measurableContent = [...expandTarget.querySelectorAll("summary, .tree-leaf, .post-row")]
          .filter((element) => element.getClientRects().length);
        const rightmostContent = measurableContent.reduce((right, element) => {
          return Math.max(right, element.getBoundingClientRect().right);
        }, targetLeft);
        const contentWidth = Math.ceil(rightmostContent - targetLeft);
        expandTarget.style.width = `${Math.min(contentWidth, availableWidth)}px`;
      }

      function drawBracket() {
        const nextPosition = getBracketPosition();
        expandWrapper.classList.toggle("bracket-bottom", nextPosition === "bottom");
        sizeExpandTargetToContent();

        if (!roughBracket || nextPosition !== bracketPosition) {
          roughBracket?.remove();
          bracketPosition = nextPosition;
          roughBracket = annotate(expandTarget, {
            type: "bracket",
            brackets: nextPosition,
            color: "#d66bea",
            strokeWidth: 3,
            padding: nextPosition === "left" ? [2, 7, 2, 9] : [2, 0, 7, 0],
            iterations: 1,
            animate: false
          });
        }

        roughBracket.show();
      }

      function updateBracketAfterToggle(event) {
        if (!expandTarget.contains(event.target)) return;
        drawBracket();
      }

      function redraw() {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          placeMarkdownNote();
          roughBox.show();
          drawBracket();
        }, 100);
      }

      placeMarkdownNote();
      requestAnimationFrame(() => {
        roughBox.show();
        drawBracket();
      });
      window.addEventListener("resize", redraw);
      contentRoot.addEventListener("toggle", updateBracketAfterToggle, true);
      expandTarget.addEventListener("load", drawBracket, true);

      stopRoughAnnotations = () => {
        window.clearTimeout(resizeTimer);
        window.removeEventListener("resize", redraw);
        contentRoot.removeEventListener("toggle", updateBracketAfterToggle, true);
        expandTarget.removeEventListener("load", drawBracket, true);
        roughBox.remove();
        roughBracket?.remove();
      };
    }

    function setupMascot() {
      stopMascot();

      const track = contentRoot.querySelector(".runner-track");
      const lane = track.querySelector(".mascot-lane");
      const runner = track.querySelector(".mascot-runner");
      const svg = runner.querySelector("svg");
      const character = runner.querySelector(".mascot-character");
      const limbs = [...character.querySelectorAll("g[class^='mascot-limb']")];
      const eyeParts = [...character.querySelectorAll("ellipse")];
      const tongue = character.querySelector("path");
      const bump = document.createElement("span");
      const tooltip = document.createElement("span");
      const svgNamespace = "http://www.w3.org/2000/svg";
      const cleanups = [];
      const timeouts = new Set();
      const pressedDirections = new Set();
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      lane.removeAttribute("aria-hidden");
      runner.setAttribute("role", "button");
      runner.setAttribute("tabindex", "0");
      runner.setAttribute("aria-label", "Bites mascot. Use the left and right arrow keys to run, and the up arrow to jump.");

      tooltip.className = "mascot-tooltip";
      tooltip.setAttribute("role", "tooltip");
      tooltip.textContent = "hi i'm bites";
      runner.append(tooltip);

      bump.className = "divider-bump";
      bump.setAttribute("aria-hidden", "true");
      track.insertBefore(bump, lane);

      const limbClasses = ["mascot-arm-left", "mascot-arm-right", "mascot-leg-left", "mascot-leg-right"];
      limbs.forEach((limb, index) => limb.classList.add(limbClasses[index]));
      tongue?.classList.add("mascot-tongue");

      if (eyeParts.length === 4) {
        const leftEye = document.createElementNS(svgNamespace, "g");
        const rightEye = document.createElementNS(svgNamespace, "g");
        leftEye.classList.add("mascot-eye");
        rightEye.classList.add("mascot-eye");
        character.insertBefore(leftEye, eyeParts[0]);
        character.insertBefore(rightEye, eyeParts[1]);
        leftEye.append(eyeParts[0], eyeParts[2]);
        rightEye.append(eyeParts[1], eyeParts[3]);
        eyeParts[2].classList.add("mascot-pupil");
        eyeParts[3].classList.add("mascot-pupil");
      }

      let x = 0;
      let direction = 1;
      let maximumX = 0;
      let lastFrame = performance.now();
      let pauseUntil = 0;
      let jumpHeight = 0;
      let jumpVelocity = 0;
      let stepElapsed = 0;
      let animationFrame = 0;
      let blinkTimeout = 0;
      let waveTimeout = 0;

      function rememberTimeout(callback, delay) {
        const id = window.setTimeout(() => {
          timeouts.delete(id);
          callback();
        }, delay);
        timeouts.add(id);
        return id;
      }

      function updateBounds() {
        maximumX = Math.max(0, lane.clientWidth - runner.offsetWidth);
        x = Math.min(x, maximumX);
      }

      function pulseDivider() {
        bump.classList.remove("is-active");
        void bump.offsetWidth;
        bump.classList.add("is-active");
      }

      function jump() {
        if (reducedMotion.matches || jumpHeight > .5) return;
        jumpVelocity = 240;
        runner.classList.remove("is-landing");
        runner.classList.add("is-airborne");
      }

      function turn(now) {
        direction *= -1;
        pauseUntil = now + 220;
        runner.classList.remove("is-turning");
        void runner.offsetWidth;
        runner.classList.add("is-turning");
        rememberTimeout(() => runner.classList.remove("is-turning"), 310);
      }

      function scheduleBlink() {
        window.clearTimeout(blinkTimeout);
        blinkTimeout = rememberTimeout(() => {
          if (!reducedMotion.matches) {
            runner.classList.add("is-blinking");
            rememberTimeout(() => runner.classList.remove("is-blinking"), 125);
          }
          scheduleBlink();
        }, 2200 + Math.random() * 3900);
      }

      function scheduleWave() {
        window.clearTimeout(waveTimeout);
        waveTimeout = rememberTimeout(() => {
          if (!reducedMotion.matches && !pressedDirections.size && jumpHeight === 0) {
            pauseUntil = performance.now() + 1150;
            runner.classList.add("is-waving");
            rememberTimeout(() => runner.classList.remove("is-waving"), 1100);
          }
          scheduleWave();
        }, 14000 + Math.random() * 10000);
      }

      function animate(now) {
        const elapsed = Math.min((now - lastFrame) / 1000, .05);
        lastFrame = now;

        if (!reducedMotion.matches) {
          if (jumpHeight > 0 || jumpVelocity > 0) {
            jumpHeight += jumpVelocity * elapsed;
            jumpVelocity -= 850 * elapsed;

            if (jumpHeight <= 0) {
              jumpHeight = 0;
              jumpVelocity = 0;
              runner.classList.remove("is-airborne");
              runner.classList.add("is-landing");
              pulseDivider();
              rememberTimeout(() => runner.classList.remove("is-landing"), 180);
            }
          }

          if (now >= pauseUntil) {
            const distanceToEdge = direction > 0 ? maximumX - x : x;
            const edgeEase = distanceToEdge < 52 ? .45 + .55 * Math.max(0, distanceToEdge / 52) : 1;
            const crossingSpeed = maximumX ? maximumX / 5.4 : 0;
            const speedBoost = pressedDirections.size ? 2.15 : 1;
            const distance = crossingSpeed * speedBoost * edgeEase * elapsed;
            x += direction * distance;

            stepElapsed += elapsed * speedBoost;
            if (stepElapsed >= .26) {
              stepElapsed = 0;
              if (jumpHeight === 0) pulseDivider();
            }

            if (x >= maximumX) {
              x = maximumX;
              turn(now);
            } else if (x <= 0) {
              x = 0;
              turn(now);
            }
          }
        } else {
          x = 0;
          jumpHeight = 0;
        }

        runner.style.setProperty("--mascot-x", `${x}px`);
        runner.style.setProperty("--mascot-jump", `${-jumpHeight}px`);
        bump.style.setProperty("--bump-x", `${x + runner.offsetWidth / 2 - 14}px`);
        animationFrame = requestAnimationFrame(animate);
      }

      function onKeyDown(event) {
        if (event.target.closest("input, textarea, select, a, summary") && event.target !== runner) return;
        if (reducedMotion.matches) return;

        if (event.key === "ArrowUp") {
          event.preventDefault();
          if (!event.repeat) jump();
          return;
        }

        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        direction = event.key === "ArrowLeft" ? -1 : 1;
        pressedDirections.add(event.key);
        runner.classList.add("is-boosting");
      }

      function onKeyUp(event) {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        pressedDirections.delete(event.key);
        if (!pressedDirections.size) runner.classList.remove("is-boosting");
      }

      function onPointerMove(event) {
        const bounds = runner.getBoundingClientRect();
        const horizontal = Math.max(-3, Math.min(3, (event.clientX - bounds.left - bounds.width / 2) / 24));
        const vertical = Math.max(-2, Math.min(2, (event.clientY - bounds.top - bounds.height / 2) / 28));
        svg.style.setProperty("--pupil-x", `${horizontal}px`);
        svg.style.setProperty("--pupil-y", `${vertical}px`);
      }

      function onRunnerKeyDown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        jump();
      }

      const resizeObserver = new ResizeObserver(updateBounds);
      resizeObserver.observe(lane);
      updateBounds();
      document.addEventListener("keydown", onKeyDown);
      document.addEventListener("keyup", onKeyUp);
      document.addEventListener("pointermove", onPointerMove, { passive: true });
      runner.addEventListener("click", jump);
      runner.addEventListener("keydown", onRunnerKeyDown);
      scheduleBlink();
      scheduleWave();
      animationFrame = requestAnimationFrame(animate);

      cleanups.push(
        () => resizeObserver.disconnect(),
        () => document.removeEventListener("keydown", onKeyDown),
        () => document.removeEventListener("keyup", onKeyUp),
        () => document.removeEventListener("pointermove", onPointerMove),
        () => runner.removeEventListener("click", jump),
        () => runner.removeEventListener("keydown", onRunnerKeyDown)
      );

      stopMascot = () => {
        cancelAnimationFrame(animationFrame);
        timeouts.forEach(window.clearTimeout);
        cleanups.forEach((cleanup) => cleanup());
      };
    }

    function renderPage(model) {
      const intro = model.intro.map((paragraph) => `<p>${renderInline(paragraph)}</p>`).join("");
      const sections = model.sections.map((section) => {
        if (section.embed === "token-activity") return `<section class="section embed"><div data-token-activity="link"></div></section>`;
        if (section.embed) return "";
        const className = section.title.toLowerCase() === "previously" ? "tree previously" : "tree";
        const isNow = section.title.toLowerCase() === "now";
        const isPreviously = section.title.toLowerCase() === "previously";
        const markdownToken = isPreviously ? `<span class="markdown-token" data-markdown-annotation>##</span>` : "##";
        const markdownNote = isPreviously && model.markdownAnnotation ? `<span class="markdown-note">${escapeHtml(model.markdownAnnotation)}</span>` : "";
        const tree = `<ul class="${className}"${isNow ? " data-expand-annotation" : ""}>${renderItems(section.items)}</ul>`;
        const treeWithAnnotation = isNow && model.expandAnnotation
          ? `<div class="expand-annotation"><span class="expand-note">${escapeHtml(model.expandAnnotation)}</span>${tree}</div>`
          : tree;
        return `<section class="section"><h2 class="section-title">${markdownToken} ${escapeHtml(section.title)}${markdownNote}</h2>${treeWithAnnotation}</section>`;
      }).join("");

      contentRoot.innerHTML = `<div class="runner-track"><hr class="rule"><div class="mascot-lane" aria-hidden="true"><div class="mascot-runner"><svg class="mascot-sprite" viewBox="-30 -42 370 241" focusable="false"><g class="mascot-character"><g class="mascot-limb-a" style="transform-origin:42px 95px"><rect x="-25" y="86" width="72" height="18" rx="9" fill="#fa5252" transform="rotate(-35 42 95)"/></g><g class="mascot-limb-b" style="transform-origin:250px 92px"><rect x="245" y="83" width="72" height="18" rx="9" fill="#fa5252" transform="rotate(35 250 92)"/></g><g class="mascot-limb-b" style="transform-origin:113px 154px"><rect x="104" y="151" width="18" height="48" rx="9" fill="#fa5252"/></g><g class="mascot-limb-a" style="transform-origin:178px 154px"><rect x="169" y="151" width="18" height="48" rx="9" fill="#fa5252"/></g><ellipse cx="101" cy="13" rx="40" ry="50" fill="#f1f3f5" stroke="#202126" stroke-width="5"/><ellipse cx="185" cy="13" rx="40" ry="50" fill="#f1f3f5" stroke="#202126" stroke-width="5"/><ellipse cx="101" cy="14" rx="19" ry="23" fill="#202126"/><ellipse cx="185" cy="14" rx="19" ry="23" fill="#202126"/><rect x="40" y="15" width="212" height="146" rx="10" fill="#fa5252"/><rect x="66" y="50" width="160" height="86" rx="7" fill="#202126"/><rect x="82" y="49" width="30" height="45" rx="2" fill="#f8f9fa" stroke="#202126" stroke-width="3"/><rect x="114" y="49" width="30" height="45" rx="2" fill="#f8f9fa" stroke="#202126" stroke-width="3"/><rect x="146" y="49" width="30" height="45" rx="2" fill="#f8f9fa" stroke="#202126" stroke-width="3"/><rect x="178" y="49" width="30" height="45" rx="2" fill="#f8f9fa" stroke="#202126" stroke-width="3"/><path d="M110 121h68l-10 17h-48z" fill="#f783ac"/></g></svg></div></div></div><header class="intro"><h1># ${renderInline(model.title)}</h1>${intro}</header>${sections}`;

      contentRoot.querySelectorAll("summary a").forEach((link) => {
        link.addEventListener("click", (event) => event.stopPropagation());
      });

      window.tokenActivityInit?.();
      setupMascot();
      setupRoughAnnotations();
    }

    fetch("content.md?raw=1", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`Could not load content.md (${response.status})`);
        return response.text();
      })
      .then((markdown) => renderPage(parseMarkdown(markdown)))
      .catch((error) => {
        contentRoot.innerHTML = `<p class="load-error">${escapeHtml(error.message)}</p>`;
      });
  </script>
</body>
</html>
