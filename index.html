<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ben Tossell — builder, investor, and maker.">
  <title>Ben Tossell</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f5f5f3;
      --surface-3: #ececea;
      --ink: #181817;
      --muted: #777773;
      --faint: #a4a49e;
      --line: #deded9;
      --line-strong: #c8c8c1;
      --accent: #1769d2;
      --accent-soft: #e8f1fc;
      --good: #087c52;
      --bad: #b42336;
      --shadow: 0 18px 70px rgba(20, 20, 15, .11);
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --left: 252px;
      --right: 300px;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn.mobile-only { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .shell {
      position: relative;
      display: grid;
      grid-template-columns: var(--left) minmax(420px, 1fr) var(--right);
      width: calc(100vw - 32px);
      height: calc(100vh - 32px);
      margin: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .rail, .detail, .chat { min-width: 0; min-height: 0; }
    .rail, .detail { background: var(--surface-2); }
    .rail { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    .detail { display: flex; flex-direction: column; border-left: 1px solid var(--line); }
    .chat { position: relative; display: grid; grid-template-rows: 48px minmax(0, 1fr) auto; background: var(--surface); }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    .topbar-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .topbar-title span { color: var(--muted); }
    .topbar-spacer { flex: 1; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }
    .icon-btn, .thread, .folder, .new-thread, .composer-tool, .send, .detail-tab, .file-change-head, .model-option, .theme-option, .switch, .secondary-button {
      transition: background-color .12s var(--ease-out), border-color .12s var(--ease-out), color .12s var(--ease-out), opacity .12s var(--ease-out), transform .12s var(--ease-out);
    }
    .icon-btn:active, .thread:active, .folder:active, .new-thread:active, .composer-tool:active, .send:active, .detail-tab:active, .file-change-head:active, .model-option:active, .theme-option:active, .switch:active, .secondary-button:active { transform: scale(.97); }
    .icon-btn:focus-visible, .thread:focus-visible, .folder:focus-visible, .new-thread:focus-visible, .composer-tool:focus-visible, .send:focus-visible, .detail-tab:focus-visible, .file-change-head:focus-visible, .model-option:focus-visible, .theme-option:focus-visible, .switch:focus-visible, .secondary-button:focus-visible, .changes-filter:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 16px 14px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font: 600 12px/1 var(--mono);
      letter-spacing: -.5px;
      background: var(--surface);
    }
    .brand-copy { min-width: 0; }
    .brand-name { font-size: 13px; font-weight: 600; line-height: 1.2; }

    .new-thread {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 10px 10px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      cursor: pointer;
      text-align: left;
    }
    .shortcut { margin-left: auto; color: var(--faint); font: 10px/1 var(--mono); }

    .rail-label {
      display: flex;
      align-items: center;
      padding: 12px 16px 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .rail-label span:last-child { margin-left: auto; font: 10px/1 var(--mono); color: var(--faint); }
    .thread-list { min-height: 0; overflow-y: auto; padding: 0 8px; }
    .folder {
      width: 100%;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      color: var(--muted);
    }
    .folder svg { width: 14px; height: 14px; }
    .folder-state-icon { position: relative; width: 14px; height: 14px; flex: none; }
    .folder-state-icon svg { position: absolute; inset: 0; transition: opacity .12s var(--ease-out), transform .12s var(--ease-out); }
    .folder-state-icon .folder-open { opacity: 0; transform: scale(.88); }
    .folder-state-icon.open .folder-closed { opacity: 0; transform: scale(.88); }
    .folder-state-icon.open .folder-open { opacity: 1; transform: scale(1); }
    .folder .chevron { width: 12px; height: 12px; transform: rotate(90deg); }
    .folder.collapsed .chevron { transform: rotate(0deg); }
    .folder-threads { display: grid; }
    .folder-threads.collapsed { display: none; }
    .thread {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 33px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .thread.active { background: var(--surface-3); color: var(--ink); }
    .thread .thread-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .thread .key { color: var(--faint); font: 10px/1 var(--mono); opacity: 0; }
    .thread.active .key { opacity: 1; }
    .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .thread .unread-dot { justify-self: end; }

    .rail-bottom { position: relative; margin-top: auto; border-top: 1px solid var(--line); padding: 10px 10px 11px; display: flex; justify-content: flex-start; }
    .messages { overflow: auto; }
    .conversation { width: min(760px, calc(100% - 48px)); margin: 0 auto; padding: 42px 0 28px; }
    .question-row { display: flex; justify-content: flex-end; margin-bottom: 28px; }
    .question {
      max-width: 78%;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 13px 13px 3px 13px;
      background: var(--surface-2);
      line-height: 1.5;
    }
    .response { min-width: 0; }
    .response-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .agent-mark { width: 24px; flex: none; }
    .agent-mark img { display: block; width: 24px; height: auto; object-fit: contain; }
    .response-head strong { font-size: 12px; font-weight: 600; }
    .response-head span { color: var(--muted); font: 10px/1 var(--mono); }
    .response-body { font-size: 14px; line-height: 1.62; }
    .response-body > p { margin: 0 0 14px; }
    .response-body h2 { margin: 26px 0 10px; font-size: 13px; font-weight: 600; }
    .response-body ul { margin: 0 0 14px; padding-left: 20px; list-style: disc; }
    .response-body li { margin: 5px 0; padding-left: 2px; }
    .response-body li::marker { color: var(--muted); }
    .response-body a { display: inline-flex; align-items: center; gap: 3px; color: var(--accent); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .external-link-icon { width: 11px; height: 11px; flex: none; }
    .response-note { margin-top: 18px; padding-left: 11px; border-left: 2px solid var(--line-strong); color: var(--muted); }
    .composer-wrap { padding: 0 16px 14px; background: linear-gradient(to bottom, transparent, var(--surface) 24%); }
    .composer {
      width: min(760px, 100%);
      margin: auto;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 8px;
      min-height: 64px;
      padding: 8px 7px 6px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: var(--surface);
      box-shadow: 0 4px 18px rgba(20,20,15,.05);
    }
    .prompt-input { grid-column: 1 / -1; width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); caret-color: var(--ink); }
    .prompt-input::placeholder { color: var(--faint); }
    .prompt-input::selection { background: color-mix(in srgb, var(--surface-3) 82%, transparent); color: var(--ink); }
    .composer-tools { display: flex; align-items: center; gap: 3px; min-width: 0; }
    .composer-tool {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 6px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .composer-tool svg { width: 12px; height: 12px; }
    .provider-logo { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--ink); font: 700 8px/1 var(--sans); letter-spacing: -.02em; }
    .model-picker {
      position: absolute;
      z-index: 12;
      right: clamp(6px, 4vw, 38px);
      bottom: 36px;
      width: 228px;
      max-width: calc(100vw - 24px);
      padding: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 12px 38px rgba(20,20,15,.16);
      transform-origin: right bottom;
      transition: opacity .15s var(--ease-out), transform .15s var(--ease-out);
    }
    .model-picker.closing { opacity: 0; transform: scale(.97); pointer-events: none; }
    @starting-style { .model-picker:not([hidden]) { opacity: 0; transform: scale(.97); } }
    .model-picker[hidden] { display: none; }
    .model-option {
      width: 100%;
      display: grid;
      grid-template-columns: 18px minmax(0,1fr) 12px;
      gap: 8px;
      align-items: center;
      padding: 6px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .model-option.active { background: var(--surface-3); }
    .model-option strong { display: block; font-size: 12px; font-weight: 600; line-height: 1.2; }
    .model-option small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.2; }
    .model-option .check { width: 12px; color: var(--accent); font-size: 11px; line-height: 1; }
    .send { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border: 0; border-radius: 7px; background: var(--ink); color: var(--surface); cursor: pointer; }
    .detail-tabs { display: flex; align-items: center; gap: 4px; }
    .detail-tab {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .detail-tab.active { background: var(--surface-3); color: var(--ink); }
    .detail-tab svg { width: 14px; height: 14px; }
    .context-panel, .changes-panel { min-height: 0; overflow-y: auto; padding: 13px 16px 24px; }
    .context-panel[hidden], .changes-panel[hidden] { display: none; }
    .env-row { display: grid; grid-template-columns: 16px 76px minmax(0, 1fr); align-items: start; gap: 6px; padding: 6px 0; font-size: 11px; line-height: 1.35; }
    .env-row svg { width: 13px; height: 13px; color: var(--muted); }
    .env-key { color: var(--muted); }
    .env-value { overflow-wrap: anywhere; }
    .env-link { min-width: 0; display: flex; align-items: center; gap: 5px; color: var(--ink); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .env-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .env-link svg { width: 10px; height: 10px; color: var(--faint); }
    .property-divider { height: 1px; margin: 12px 0 8px; background: var(--line); }
    .dirty { color: var(--bad); font-weight: 600; }
    .git-summary { display: flex; align-items: center; gap: 7px; padding: 18px 0 8px; color: var(--muted); font-size: 10px; }
    .git-summary strong { color: var(--ink); font-weight: 500; }
    .add { color: var(--good); }
    .del { color: var(--bad); }
    .mini-files { display: grid; gap: 1px; }
    .mini-file { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 6px; padding: 5px 0; font: 10px/1.3 var(--mono); }
    .mini-file .state { color: var(--muted); }
    .mini-file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-file .counts { white-space: nowrap; font: 10px/1.3 var(--mono); }
    .changes-toolbar { display: flex; align-items: center; gap: 8px; padding: 2px 0 10px; }
    .changes-filter-wrap { position: relative; flex: 0 1 auto; min-width: 0; }
    .changes-filter {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      height: 26px;
      width: auto;
      max-width: 100%;
      margin: 0;
      padding: 0 22px 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font-size: 10px;
      line-height: 24px;
      cursor: pointer;
    }
    .changes-filter-wrap::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 8px;
      width: 5px;
      height: 5px;
      border-right: 1.4px solid var(--muted);
      border-bottom: 1.4px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .changes-count { color: var(--muted); font: 10px/1 var(--mono); white-space: nowrap; }
    .file-change { margin-bottom: 5px; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
    .file-change[hidden] { display: none; }
    .file-change-head { width: 100%; min-height: 29px; display: grid; grid-template-columns: 14px 14px minmax(0,1fr) auto; gap: 6px; align-items: center; padding: 6px 8px; border: 0; background: var(--surface); color: inherit; cursor: pointer; text-align: left; }
    .file-change-head svg { width: 11px; height: 11px; color: var(--muted); }
    .file-change.open .file-change-head svg { transform: rotate(90deg); }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px/1 var(--mono); }
    .file-status { color: var(--muted); font: 10px/1 var(--mono); }
    .file-change-head .counts { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px/1 var(--mono); color: var(--muted); }
    .diff { display: none; overflow-x: auto; border-top: 1px solid var(--line); background: var(--surface-2); font: 10px/1.5 var(--mono); }
    .file-change.open .diff { display: block; }
    .diff-line { display: grid; grid-template-columns: 22px 22px minmax(max-content, 1fr); min-width: 100%; padding: 1px 8px; }
    .diff-line .ln { color: var(--faint); text-align: right; padding-right: 6px; }
    .diff-line.plus { background: color-mix(in srgb, #27a269 14%, transparent); }
    .diff-line.minus { background: color-mix(in srgb, #db4b58 13%, transparent); }


    .settings-popover {
      position: absolute;
      z-index: 20;
      left: 10px;
      right: 10px;
      bottom: calc(100% + 8px);
      max-height: min(420px, calc(100dvh - 88px));
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 12px 38px rgba(20,20,15,.16);
      transform-origin: left bottom;
      transition: opacity .15s var(--ease-out), transform .15s var(--ease-out);
    }
    .settings-popover.closing { opacity: 0; transform: scale(.97); pointer-events: none; }
    @starting-style { .settings-popover:not([hidden]) { opacity: 0; transform: scale(.97); } }
    .settings-popover[hidden] { display: none; }
    .settings-head { display: flex; align-items: center; padding: 9px 10px 8px; border-bottom: 1px solid var(--line); }
    .settings-head h2 { margin: 0; font-size: 12px; }
    .settings-head button { margin-left: auto; }
    .settings-body { padding: 0 10px 10px; }
    .settings-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .settings-row.stack { grid-template-columns: minmax(0, 1fr); gap: 7px; }
    .settings-row:last-child { border-bottom: 0; padding-bottom: 2px; }
    .settings-row h3 { margin: 0 0 2px; font-size: 12px; font-weight: 600; }
    .settings-row p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .theme-options { display: flex; width: 100%; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); }
    .theme-option { flex: 1; padding: 5px 6px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
    .theme-option.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .usage { width: 100%; }
    .usage-top { display: flex; justify-content: space-between; margin-bottom: 6px; font: 9px/1 var(--mono); }
    .usage-track { height: 5px; overflow: hidden; border-radius: 5px; background: var(--surface-3); }
    .usage-fill { width: 72%; height: 100%; background: var(--accent); }
    .switch { position: relative; width: 32px; height: 18px; border: 0; border-radius: 18px; background: var(--line-strong); cursor: pointer; transition: background-color .15s var(--ease-out), transform .12s var(--ease-out); }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: white; transition: transform .15s var(--ease-out); }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(14px); }
    .secondary-button { padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 10px; cursor: pointer; }
    .show-more-files { margin: 6px 0 12px; padding: 3px 0; border: 0; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; text-align: left; }
    .show-more-files:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (hover: hover) and (pointer: fine) {
      .icon-btn:hover { background: var(--surface-3); }
      .new-thread:hover { border-color: var(--line-strong); }
      .folder:hover { background: var(--surface-3); color: var(--ink); }
      .thread:hover { background: var(--surface-3); }
      .thread:hover .key { opacity: 1; }
      .response-body a:hover { opacity: .78; }
      .composer-tool:hover { background: var(--surface-3); color: var(--ink); }
      .model-option:hover { background: var(--surface-3); }
      .send:hover { opacity: .82; }
      .detail-tab:hover { background: var(--surface-3); color: var(--ink); }
      .env-link:hover { opacity: .72; }
      .file-change-head:hover { background: var(--surface-2); }
      .changes-filter:hover { border-color: var(--line-strong); }
      .secondary-button:hover { background: var(--surface-2); }
      .show-more-files:hover { color: var(--ink); text-decoration: underline; }
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0d0c;
      --surface: #111311;
      --surface-2: #161916;
      --surface-3: #20241f;
      --ink: #e2e6e2;
      --muted: #929b92;
      --faint: #626a63;
      --line: #292e29;
      --line-strong: #3c443d;
      --accent: #7aa8f8;
      --accent-soft: #17253d;
      --good: #66c58c;
      --bad: #ff8795;
      --shadow: 0 20px 70px rgba(0,0,0,.46);
    }

    .toast {
      position: fixed;
      z-index: 20;
      top: 28px;
      left: 50%;
      transform: translate(-50%, -8px);
      padding: 8px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--ink);
      color: var(--surface);
      box-shadow: var(--shadow);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s var(--ease-out), transform .18s var(--ease-out);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .left-hidden { grid-template-columns: 0 minmax(420px, 1fr) var(--right); }
    .left-hidden .rail { overflow: hidden; border: 0; }
    .right-hidden { grid-template-columns: var(--left) minmax(420px, 1fr) 0; }
    .right-hidden .detail { overflow: hidden; border: 0; }
    .left-hidden.right-hidden { grid-template-columns: 0 minmax(420px, 1fr) 0; }
    .detail-wide { --right: min(620px, 52vw); }
    .drawer-scrim { display: none; }

    const modelOptions = [
      { provider: 'OpenAI', mark: 'O', model: '5.6 Sol', effort: 'High' },
      { provider: 'Anthropic', mark: 'A', model: 'Fable', effort: 'High' },

    const escapeHtml = (value) => value.replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const gitTotals = () => gitFiles.reduce((totals, file) => ({ add: totals.add + Number(file.add || 0), del: totals.del + Number(file.del || 0) }), { add: 0, del: 0 });

    function hideAfterTransition(element, fallbackMs, onHidden) {
      let finished = false;
      let timer;
      const finish = event => {
        if (event && event.target !== element) return;
        if (finished) return;
        finished = true;
        element.removeEventListener('transitionend', finish);
        clearTimeout(timer);
        element.hidden = true;
        element.classList.remove('closing');
        onHidden();
      };
      element.addEventListener('transitionend', finish);
      timer = setTimeout(finish, fallbackMs);
      return () => {
        if (finished) return;
        finished = true;
        element.removeEventListener('transitionend', finish);
        clearTimeout(timer);
        element.classList.remove('closing');
      };
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]+)\)/g, (_, label, href) => {
          const external = icon('external').replace('<svg', '<svg class="external-link-icon"');
          return `<a href="${href}">${label}${external}</a>`;
        })
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.+?)`/g, '<code>$1</code>');
    }

    function markdownHtml(markdown) {
      const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
      const output = [];
      const startsBlock = line => /^(#{2,3})\s+|^>\s?|^-\s+/.test(line.trim());
      let index = 0;

      while (index < lines.length) {
        const line = lines[index].trim();
        if (!line) { index += 1; continue; }

        const heading = line.match(/^(#{2,3})\s+(.+)$/);
        if (heading) {
          output.push(`<h2>${inlineMarkdown(heading[2])}</h2>`);
          index += 1;
          continue;
        }

        if (line.startsWith('>')) {
          const quote = [];
          while (index < lines.length && lines[index].trim().startsWith('>')) {
            quote.push(lines[index].trim().replace(/^>\s?/, ''));
            index += 1;
          }
          output.push(`<p class="response-note">${inlineMarkdown(quote.join(' '))}</p>`);
          continue;
        }

        if (line.startsWith('- ')) {
          const items = [];
          while (index < lines.length && lines[index].trim().startsWith('- ')) {
            const item = lines[index].trim().slice(2);
            items.push(`<li>${inlineMarkdown(item)}</li>`);
            index += 1;
          }
          output.push(`<ul>${items.join('')}</ul>`);
          continue;
        }

        const paragraph = [line];
        index += 1;
        while (index < lines.length && lines[index].trim() && !startsBlock(lines[index])) {
          paragraph.push(lines[index].trim());
          index += 1;
        }
        output.push(`<p>${inlineMarkdown(paragraph.join(' '))}</p>`);
      }

      return output.join('');
    }

    function parseThreadMarkdown(file, raw) {
      const frontmatter = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
      if (!frontmatter) throw new Error(`${file} needs frontmatter`);
      const data = {};
      frontmatter[1].split('\n').forEach(line => {
        const splitAt = line.indexOf(':');
        if (splitAt < 0) return;
        data[line.slice(0, splitAt).trim()] = line.slice(splitAt + 1).trim().replace(/^['"]|['"]$/g, '');
      });
      const id = data.id || file.replace(/\.md$/, '');
      return {
        id,
        title: data.title || id,
        slug: data.slug || id,
        question: data.question || `Tell me about ${data.title || id}`,
        html: markdownHtml(raw.slice(frontmatter[0].length).trim())
      };
    }

    function unwrapMarkdownViewer(raw, contentType) {
      if (!contentType.includes('text/html')) return raw;
      const documentCopy = new DOMParser().parseFromString(raw, 'text/html');
      return documentCopy.querySelector('#raw')?.textContent || raw;
    }

    async function loadThreads() {
      const manifestResponse = await fetch('threads/index.json', { cache: 'no-store' });
      if (!manifestResponse.ok) throw new Error('Could not load threads/index.json');
      const files = await manifestResponse.json();
      const loaded = await Promise.all(files.map(async file => {
        const response = await fetch(`threads/${file}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not load threads/${file}`);
        const raw = await response.text();
        return parseThreadMarkdown(file, unwrapMarkdownViewer(raw, response.headers.get('content-type') || ''));
      }));
      threads = Object.fromEntries(loaded.map(thread => [thread.id, thread]));
    }

    function renderList() {
      const hasUnread = Object.keys(threads).some(id => !visited.has(id));

        </button>
        <div class="folder-threads ${folderOpen ? '' : 'collapsed'}" id="folderThreads">
          ${Object.entries(threads).map(([id, item], index) => `
            <button class="thread ${id === current ? 'active' : ''}" data-thread="${id}" ${id === current ? 'aria-current="page"' : ''} aria-label="${item.title}${visited.has(id) ? '' : ', unread'}">
              <span class="thread-title">${item.title}</span>${visited.has(id) ? `<span class="key">${index + 1}</span>` : '<span class="unread-dot" aria-hidden="true"></span>'}
            </button>`).join('')}
        </div>`;
      document.getElementById('benFolder').addEventListener('click', () => {
        folderOpen = !folderOpen;
        const folder = document.getElementById('benFolder');
        folder.classList.toggle('collapsed', !folderOpen);
        folder.setAttribute('aria-expanded', String(folderOpen));
        folder.querySelector('.folder-state-icon').classList.toggle('open', folderOpen);
        document.getElementById('folderThreads').classList.toggle('collapsed', !folderOpen);

      list.querySelectorAll('.thread').forEach(button => button.addEventListener('click', () => selectThread(button.dataset.thread)));

    function renderConversation(item, followUp = null) {
      const question = followUp || item.question;

          <div class="response-body">${body}</div>

      messages.scrollTo({ top: 0, behavior: 'instant' });

    function renderContext() {
      const totals = gitTotals();
      const links = socialLinks.map(link => `<div class="env-row">${icon(link.icon)}<span class="env-key">${link.label}</span><a class="env-link" href="${link.href}" target="_blank" rel="noreferrer"><span>${link.handle}</span>${icon('external')}</a></div>`).join('');
      const previewFiles = gitFiles.slice(0, 5).map(file => `<div class="mini-file"><span class="state">${file.status}</span><span class="name">${file.name}</span><span class="counts"><span class="add">+${file.add}</span>${file.del ? ` <span class="del">-${file.del}</span>` : ''}</span></div>`).join('');
      const remaining = Math.max(0, gitFiles.length - 5);
      contextPanel.innerHTML = `
        <div class="env-row">${icon('user')}<span class="env-key">Parent</span><span class="env-value">None</span></div>
        <div class="env-row">${icon('laptop')}<span class="env-key">Environment</span><span class="env-value">${escapeHtml(gitStatus.environment)}</span></div>
        <div class="env-row">${icon('folder')}<span class="env-key">Directory</span><span class="env-value">${escapeHtml(gitStatus.directory)}</span></div>
        <div class="env-row">${icon('branch')}<span class="env-key">Branch</span><span class="env-value">${escapeHtml(gitStatus.branch)}</span></div>
        <div class="env-row">${icon('activity')}<span class="env-key">Git status</span><span class="env-value dirty">${escapeHtml(gitStatus.status)}</span></div>
        <div class="git-summary"><strong>Uncommitted</strong><span>${gitFiles.length} files, <span class="add">+${totals.add}</span> <span class="del">-${totals.del}</span></span></div>
        <div class="mini-files">${previewFiles}</div>
        ${remaining ? `<button class="show-more-files" type="button" id="showAllChanges">Show ${remaining} more</button>` : ''}
        <div class="property-divider"></div>${links}`;
      configureLinks(contextPanel);
      document.getElementById('showAllChanges')?.addEventListener('click', () => activateDetailTab('changes'));
    }

    function renderChanges() {
      const totals = gitTotals();
      const fileHtml = gitFiles.map((file, index) => {
        const diff = file.diff || [['', '', '', 'No inline preview for this file.']];
        return `<div class="file-change" data-file="${index}">
          <button class="file-change-head">${icon('chevron')}<span class="file-status">${file.status}</span><span class="file-name">${file.name}</span><span class="counts"><span class="add">+${file.add}</span>${file.del ? ` <span class="del">-${file.del}</span>` : ''}</span></button>
          <div class="diff">${diff.map(([type, oldLine, newLine, code]) => `<div class="diff-line ${type}"><span class="ln">${oldLine}</span><span class="ln">${newLine}</span><span>${escapeHtml(code)}</span></div>`).join('')}</div>
        </div>`;
      }).join('');
      changesPanel.innerHTML = `<div class="changes-toolbar"><label class="changes-filter-wrap"><select class="changes-filter" aria-label="Change filter"><option value="all">All changes</option><option value="modified">Modified</option><option value="added">Added</option></select></label><span class="changes-count">${gitFiles.length} files, <span class="add">+${totals.add}</span> <span class="del">-${totals.del}</span></span></div>${fileHtml}`;
      changesPanel.querySelectorAll('.file-change-head').forEach(button => button.addEventListener('click', () => button.parentElement.classList.toggle('open')));
      changesPanel.querySelector('.changes-filter').addEventListener('change', event => {
        const visibleFiles = [];
        changesPanel.querySelectorAll('.file-change').forEach((row, index) => {
          const file = gitFiles[index];
          row.hidden = event.target.value === 'modified' ? file.status !== 'M' : event.target.value === 'added' ? file.status !== 'A' : false;
          if (!row.hidden) visibleFiles.push(file);
        });
        const filteredTotals = visibleFiles.reduce((sum, file) => ({ add: sum.add + file.add, del: sum.del + file.del }), { add: 0, del: 0 });
        changesPanel.querySelector('.changes-count').innerHTML = `${visibleFiles.length} files, <span class="add">+${filteredTotals.add}</span> <span class="del">-${filteredTotals.del}</span>`;
      });
    }

    function activateDetailTab(tab) {
      const showContext = tab === 'context';
      contextPanel.hidden = !showContext;
      changesPanel.hidden = showContext;
      document.getElementById('contextTab').classList.toggle('active', showContext);
      document.getElementById('changesTab').classList.toggle('active', !showContext);
      document.getElementById('contextTab').setAttribute('aria-pressed', String(showContext));
      document.getElementById('changesTab').setAttribute('aria-pressed', String(!showContext));
    }

    function selectThread(id) {
      if (!threads[id]) return;
      current = id;
      const item = threads[id];
      visited.add(id);
      localStorage.setItem('ben-visited-threads', JSON.stringify([...visited]));
      topTitle.textContent = item.slug;
      renderList();
      renderConversation(item);
      renderContext();
      history.replaceState(null, '', `#${id}`);
      closeMobilePanels();
    }

    function submitPrompt(value) {
      const question = value.trim();
      if (!question) return;
      renderConversation(threads[current], question);
      promptInput.value = '';
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function renderModels() {
      modelPicker.innerHTML = modelOptions.map((option, index) => `<button class="model-option ${index === selectedModel ? 'active' : ''}" type="button" role="option" aria-selected="${index === selectedModel}" data-model="${index}"><span class="provider-logo">${option.mark}</span><span><strong>${option.model}</strong><small>${option.provider} · ${option.effort}</small></span><span class="check" aria-hidden="true">${index === selectedModel ? '✓' : ''}</span></button>`).join('');
      modelPicker.querySelectorAll('.model-option').forEach(button => button.addEventListener('click', () => selectModel(Number(button.dataset.model))));
    }

    function selectModel(index) {
      selectedModel = index;
      const selection = modelOptions[selectedModel];
      document.getElementById('modelLabel').textContent = selection.model;
      document.getElementById('effortLabel').textContent = selection.effort;
      document.getElementById('providerLogo').textContent = selection.mark;
      closeModelPicker();
      renderModels();
      modelButton.focus();
    }

    function openModelPicker() {
      cancelModelPickerClose?.();
      cancelModelPickerClose = null;
      modelPicker.hidden = false;
      modelButton.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => modelPicker.querySelector(`[data-model="${selectedModel}"]`)?.focus());
    }

    function closeModelPicker({ restoreFocus = false } = {}) {
      if (modelPicker.hidden || modelPicker.classList.contains('closing')) return;
      modelButton.setAttribute('aria-expanded', 'false');
      modelPicker.classList.add('closing');
      cancelModelPickerClose = hideAfterTransition(modelPicker, 200, () => {
        cancelModelPickerClose = null;
        if (restoreFocus) modelButton.focus();
      });
    }

    function setTheme(theme) {
      const resolved = theme === 'system' && colorScheme.matches ? 'dark' : theme === 'system' ? 'light' : theme;
      document.body.dataset.theme = resolved;
      localStorage.setItem('ben-theme', theme);
      document.querySelectorAll('.theme-option').forEach(button => {
        const active = button.dataset.theme === theme;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function closeSettingsPopover({ restoreFocus = true } = {}) {
      if (settingsPopover.hidden || settingsPopover.classList.contains('closing')) return;
      settingsTrigger.setAttribute('aria-expanded', 'false');
      settingsPopover.classList.add('closing');
      cancelSettingsClose = hideAfterTransition(settingsPopover, 200, () => {
        cancelSettingsClose = null;
        if (restoreFocus) settingsTrigger.focus();
      });
    }

    function openSettingsPopover() {
      cancelSettingsClose?.();
      cancelSettingsClose = null;
      settingsPopover.hidden = false;
      settingsTrigger.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => document.getElementById('closeSettings').focus());
    }

    function trapSettingsFocus(event) {
      const focusable = [...settingsPopover.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')];
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }

    function setLeftHidden(hidden) {
      shell.classList.toggle('left-hidden', hidden);
      if (hidden) closeSettingsPopover({ restoreFocus: false });
      const button = document.getElementById('leftToggle');
      button.setAttribute('aria-label', hidden ? 'Show threads' : 'Hide threads');
      button.setAttribute('aria-pressed', String(hidden));
      document.getElementById('leftToggleIcon').innerHTML = hidden
        ? '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M5 4v16M9 9l3 3-3 3"/>'
        : '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>';
    }

    function setDetailWide(expanded) {
      shell.classList.toggle('detail-wide', expanded);
      const button = document.getElementById('detailExpand');
      button.setAttribute('aria-label', expanded ? 'Restore sidebar width' : 'Expand sidebar');
      button.setAttribute('aria-pressed', String(expanded));
      document.getElementById('detailExpandIcon').innerHTML = expanded
        ? '<path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/>'
        : '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>';
    }

    function setRightHidden(hidden) {
      shell.classList.toggle('right-hidden', hidden);
      const button = document.getElementById('rightToggle');
      button.setAttribute('aria-label', hidden ? 'Show details' : 'Hide details');
      button.setAttribute('aria-pressed', String(hidden));
      document.getElementById('rightToggleIcon').innerHTML = hidden
        ? '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M19 4v16M15 9l-3 3 3 3"/>'
        : '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>';
    }

    async function loadConnectedGitStatus() {
      const endpoint = document.documentElement.dataset.gitStatusEndpoint;
      if (!endpoint) return;
      try {
        const response = await fetch(endpoint);
        if (!response.ok) return;
        const data = await response.json();
        if (Array.isArray(data.files)) {
          gitFiles = data.files.map(file => ({
            name: file.name,
            status: /^(a|added|\?\?)/i.test(String(file.status || '')) ? 'A' : 'M',
            add: file.additions || 0,
            del: file.deletions || 0,
            diff: file.diff
          }));
        }
        gitStatus = { ...gitStatus, ...data.context };
        renderChanges();
        renderContext();
      } catch { /* Keep the prototype data when no connector is available. */ }
    }

    document.getElementById('composer').addEventListener('submit', event => {
      event.preventDefault();
      submitPrompt(promptInput.value);
    });
    document.getElementById('newThread').addEventListener('click', () => {
      promptInput.focus();
      closeMobilePanels();
      showToast('Start a new question');
    });
    document.getElementById('leftToggle').addEventListener('click', () => {
      if (matchMedia('(max-width: 680px)').matches) {
        const opening = !shell.classList.contains('mobile-menu');
        closeMobilePanels();
        shell.classList.toggle('mobile-menu', opening);
      } else setLeftHidden(!shell.classList.contains('left-hidden'));
    });
    document.getElementById('closeMobile').addEventListener('click', closeMobilePanels);
    document.getElementById('closeDetailMobile').addEventListener('click', closeMobilePanels);
    document.getElementById('drawerScrim').addEventListener('click', closeMobilePanels);
    document.getElementById('rightToggle').addEventListener('click', () => {
      if (matchMedia('(max-width: 980px)').matches) {
        const opening = !shell.classList.contains('mobile-detail');
        closeMobilePanels();
        shell.classList.toggle('mobile-detail', opening);
      } else setRightHidden(!shell.classList.contains('right-hidden'));
    });
    document.getElementById('detailExpand').addEventListener('click', () => setDetailWide(!shell.classList.contains('detail-wide')));
    document.getElementById('contextTab').addEventListener('click', () => activateDetailTab('context'));
    document.getElementById('changesTab').addEventListener('click', () => activateDetailTab('changes'));

    modelButton.addEventListener('click', () => {
      if (modelPicker.hidden || modelPicker.classList.contains('closing')) openModelPicker();
      else closeModelPicker({ restoreFocus: true });
    });
    document.addEventListener('click', event => {
      if (!modelPicker.hidden && !modelPicker.contains(event.target) && !modelButton.contains(event.target)) closeModelPicker();
      if (!settingsPopover.hidden && !settingsPopover.contains(event.target) && !settingsTrigger.contains(event.target)) closeSettingsPopover({ restoreFocus: false });
    });

    settingsTrigger.addEventListener('click', () => {
      closeModelPicker();
      if (settingsPopover.hidden || settingsPopover.classList.contains('closing')) openSettingsPopover();
      else closeSettingsPopover({ restoreFocus: true });
    });
    document.getElementById('closeSettings').addEventListener('click', () => closeSettingsPopover());
    document.querySelectorAll('.theme-option').forEach(button => button.addEventListener('click', () => setTheme(button.dataset.theme)));
    document.getElementById('petSwitch').addEventListener('click', event => {
      const enabled = !event.currentTarget.classList.contains('on');
      event.currentTarget.classList.toggle('on', enabled);
      event.currentTarget.setAttribute('aria-checked', String(enabled));
      showToast(enabled ? 'Pet enabled · photo needed' : 'Pet hidden');
    });
    document.getElementById('inviteButton').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); showToast('Invite link copied'); }
      catch { showToast('Copy is unavailable in this preview'); }
    });
    document.getElementById('addContext').addEventListener('click', () => showToast('Context picker is not in this prototype'));
    document.getElementById('approvalMode').addEventListener('click', () => showToast('Approval modes are not in this prototype'));
    document.getElementById('voiceInput').addEventListener('click', () => showToast('Voice input is not in this prototype'));

    function closeMobilePanels() {
      shell.classList.remove('mobile-menu', 'mobile-detail');
      closeSettingsPopover({ restoreFocus: false });
    }

    colorScheme.addEventListener('change', () => {
      if ((localStorage.getItem('ben-theme') || 'light') === 'system') setTheme('system');
    });

    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (threads[id] && id !== current) selectThread(id);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (!settingsPopover.hidden) closeSettingsPopover();
        closeModelPicker({ restoreFocus: true });
        closeMobilePanels();
        return;
      }
      if (!settingsPopover.hidden && event.key === 'Tab') { trapSettingsFocus(event); return; }
      if (!modelPicker.hidden && ['ArrowDown', 'ArrowUp', 'Home', 'End', 'Enter'].includes(event.key)) {
        const options = [...modelPicker.querySelectorAll('.model-option')];
        const focusedIndex = Math.max(0, options.indexOf(document.activeElement));
        if (event.key === 'Enter') { event.preventDefault(); selectModel(Number(options[focusedIndex].dataset.model)); return; }
        event.preventDefault();
        const nextIndex = event.key === 'Home' ? 0 : event.key === 'End' ? options.length - 1 : event.key === 'ArrowDown' ? (focusedIndex + 1) % options.length : (focusedIndex - 1 + options.length) % options.length;
        options[nextIndex].focus();
        return;
      }
      if (event.target.matches('input, textarea, select, [contenteditable="true"]')) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const ids = Object.keys(threads);
      if (/^[1-9]$/.test(event.key) && ids[Number(event.key) - 1]) { event.preventDefault(); selectThread(ids[Number(event.key) - 1]); }
      if (event.key.toLowerCase() === 'n') { event.preventDefault(); promptInput.focus(); }
    });

    async function start() {
      renderModels();
      renderChanges();
      setTheme(localStorage.getItem('ben-theme') || 'light');
      setLeftHidden(shell.classList.contains('left-hidden'));
      setRightHidden(shell.classList.contains('right-hidden'));
      setDetailWide(shell.classList.contains('detail-wide'));

      try {
        await loadThreads();
        const initial = location.hash.slice(1);
        const defaultThread = threads.about ? 'about' : Object.keys(threads)[0];
        selectThread(threads[initial] ? initial : defaultThread);
        loadConnectedGitStatus();
      } catch (error) {
        conversation.innerHTML = `<article class="response"><div class="response-body"><h2>Threads could not load</h2><p>${escapeHtml(error.message)}</p><p class="response-note">Run this site through <code>npm run dev</code>. Markdown files cannot load when index.html is opened directly.</p></div></article>`;
        console.error(error);
      }
    }

    start();
  </script>
</body>
</html>
